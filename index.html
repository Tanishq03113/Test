<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maid Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col items-center pt-8 px-4">

  <!-- LOGIN VIEW -->
  <div id="loginView" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-gray-900">Maid Login</h2>
      <p class="text-sm text-gray-500 mt-1">Enter your details to view today's visits</p>
    </div>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
        <input type="tel" id="phone" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="e.g. 9123456789">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">4-Digit PIN</label>
        <input type="password" id="pin" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="••••">
      </div>
      <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all active:scale-95 mt-2">
        Sign In
      </button>
      <p id="errorMsg" class="text-red-500 text-center text-sm font-medium hidden"></p>
    </div>
  </div>

  <!-- TASKS VIEW -->
  <div id="tasksView" class="w-full max-w-md hidden">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 id="welcomeText" class="text-xl font-bold text-gray-900"></h2>
        <p class="text-sm text-gray-500" id="dateText"></p>
      </div>
      <button id="logoutBtn" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-semibold text-sm hover:bg-red-100 transition">Sign Out</button>
    </div>
    <div id="taskList" class="space-y-4"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
    apiKey: "AIzaSyA24bw7FrAKTH0_Uhh7ECTbRZoQ7FdhZCQ",
    authDomain: "maidattendance-2a612.firebaseapp.com",
    projectId: "maidattendance-2a612",
    storageBucket: "maidattendance-2a612.firebasestorage.app",
    messagingSenderId: "275781550714",
    appId: "1:275781550714:web:4268d16d51f6d8405ab1c3",
    measurementId: "G-GRLXDQ1TWD"
  };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    const loginView = document.getElementById('loginView');
    const tasksView = document.getElementById('tasksView');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const taskList = document.getElementById('taskList');

    // Auto-login check
    const savedMaidId = localStorage.getItem('maidId');
    const savedMaidName = localStorage.getItem('maidName');
    if (savedMaidId) showTasks(savedMaidId, savedMaidName);

    // Login Logic
    loginBtn.addEventListener('click', async () => {
      const phone = document.getElementById('phone').value.trim();
      const pin = document.getElementById('pin').value.trim();
      
      if (!phone || !pin) return showError("Please enter phone and PIN");
      
      loginBtn.innerText = "Verifying...";
      loginBtn.disabled = true;

      try {
        const q = query(collection(db, "maids"), where("phone", "==", phone), where("pin", "==", pin), where("status", "==", "ACTIVE"));
        const snapshot = await getDocs(q);
        
        if (snapshot.empty) {
          showError("Invalid phone or PIN");
        } else {
          const maidData = snapshot.docs[0].data();
          localStorage.setItem('maidId', maidData.maidId);
          localStorage.setItem('maidName', maidData.name);
          showTasks(maidData.maidId, maidData.name);
        }
      } catch (err) {
        showError("Network error. Try again.");
      }
      loginBtn.innerText = "Sign In";
      loginBtn.disabled = false;
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      location.reload();
    });

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.classList.remove('hidden');
    }

    // Fetch and Render Tasks
    async function showTasks(maidId, maidName) {
      loginView.classList.add('hidden');
      tasksView.classList.remove('hidden');
      document.getElementById('welcomeText').innerText = `Hi, ${maidName}`;
      
      const today = new Date();
      // Format to YYYY-MM-DD matching local time
      const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
      document.getElementById('dateText').innerText = today.toDateString();

      taskList.innerHTML = `<p class="text-center text-gray-500 mt-8 animate-pulse">Fetching today's visits...</p>`;

      try {
        const q = query(collection(db, "bookings"), where("maidId", "==", maidId), where("date", "==", todayStr));
        const snapshot = await getDocs(q);
        
        if (snapshot.empty) {
          taskList.innerHTML = `
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
              <p class="text-gray-500 font-medium">No visits scheduled for today.</p>
            </div>`;
          return;
        }

        let html = '';
        snapshot.forEach(docSnap => {
          const t = docSnap.data();
          const docId = docSnap.id; // Firestore internal document ID
          
          let statusBadge = '';
          if (t.status === 'SCHEDULED') {
            html += `<button onclick="window.requestOtp('${docId}', 'START', '${t.customerPhone}')" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition">Arrived: Start Service</button>`;
          } else if (t.status === 'START_OTP_PENDING') {
            html += `
              <div class="flex gap-2">
                <input type="number" id="otp_${docId}" class="w-2/3 px-4 py-3 rounded-xl border border-gray-300 outline-none focus:border-green-500" placeholder="Enter OTP">
                <button onclick="window.verifyOtp('${docId}', 'START', 'otp_${docId}')" class="w-1/3 bg-green-600 text-white font-bold py-3 rounded-xl active:scale-95 transition">Verify</button>
              </div>
              <button onclick="window.requestOtp('${docId}', 'START', '${t.customerPhone}')" class="mt-3 text-sm text-blue-600 font-semibold w-full text-center hover:underline">🔄 Resend OTP</button>`;
          } else if (t.status === 'IN_PROGRESS') {
            html += `<button onclick="window.requestOtp('${docId}', 'FINISH', '${t.customerPhone}')" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition">Done: Finish Service</button>`;
          } else if (t.status === 'FINISH_OTP_PENDING') {
            html += `
              <div class="flex gap-2">
                <input type="number" id="otp_${docId}" class="w-2/3 px-4 py-3 rounded-xl border border-gray-300 outline-none focus:border-green-500" placeholder="Enter OTP">
                <button onclick="window.verifyOtp('${docId}', 'FINISH', 'otp_${docId}')" class="w-1/3 bg-green-600 text-white font-bold py-3 rounded-xl active:scale-95 transition">Verify</button>
              </div>
              <button onclick="window.requestOtp('${docId}', 'FINISH', '${t.customerPhone}')" class="mt-3 text-sm text-blue-600 font-semibold w-full text-center hover:underline">🔄 Resend OTP</button>`;
          } else if (t.status === 'COMPLETED') {
            html += `<p class="text-green-600 font-bold text-center bg-green-50 py-3 rounded-xl">✔ Service Verified</p>`;
          }
          else statusBadge = '<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold">OTP PENDING</span>';

          html += `
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4 transition">
              <div class="flex justify-between items-start mb-3">
                <div>
                  <h3 class="text-lg font-bold text-gray-900">${t.time}</h3>
                  <p class="text-gray-600 font-medium">${t.customerName}</p>
                </div>
                ${statusBadge}
              </div>
              <p class="text-gray-500 text-sm mb-4">📍 ${t.address}</p>
          `;

          if (t.status === 'SCHEDULED') {
            html += `<button onclick="window.requestOtp('${docId}', 'START')" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition">Arrived: Start Service</button>`;
          } else if (t.status === 'START_OTP_PENDING') {
            html += `
              <div class="flex gap-2">
                <input type="number" id="otp_${docId}" class="w-2/3 px-4 py-3 rounded-xl border border-gray-300 outline-none focus:border-green-500" placeholder="Enter OTP">
                <button onclick="window.verifyOtp('${docId}', 'START', 'otp_${docId}')" class="w-1/3 bg-green-600 text-white font-bold py-3 rounded-xl active:scale-95 transition">Verify</button>
              </div>`;
          } else if (t.status === 'IN_PROGRESS') {
            html += `<button onclick="window.requestOtp('${docId}', 'FINISH')" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition">Done: Finish Service</button>`;
          } else if (t.status === 'FINISH_OTP_PENDING') {
            html += `
              <div class="flex gap-2">
                <input type="number" id="otp_${docId}" class="w-2/3 px-4 py-3 rounded-xl border border-gray-300 outline-none focus:border-green-500" placeholder="Enter OTP">
                <button onclick="window.verifyOtp('${docId}', 'FINISH', 'otp_${docId}')" class="w-1/3 bg-green-600 text-white font-bold py-3 rounded-xl active:scale-95 transition">Verify</button>
              </div>`;
          } else if (t.status === 'COMPLETED') {
            html += `<p class="text-green-600 font-bold text-center bg-green-50 py-3 rounded-xl">✔ Service Verified</p>`;
          }
          
          html += `</div>`;
        });
        taskList.innerHTML = html;
      } catch (err) {
        taskList.innerHTML = `<p class="text-red-500 text-center">Failed to load visits.</p>`;
      }
    }

    // Expose functions to window so inline onclick can use them
    // --- REPLACE window.requestOtp WITH THIS ---
    window.requestOtp = async function(docId, stage, customerPhone) {
      const otp = Math.floor(1000 + Math.random() * 9000).toString();
      const ref = doc(db, "bookings", docId);
      
      try {
        if (stage === 'START') {
          await updateDoc(ref, { status: "START_OTP_PENDING", startOtp: otp });
        } else {
          await updateDoc(ref, { status: "FINISH_OTP_PENDING", finishOtp: otp });
        }

        // Call the Webhook to send the real SMS
        await sendSmsWebhook(customerPhone, otp, stage);

        alert(`OTP requested! (Demo bypass: ${otp})`);
        showTasks(localStorage.getItem('maidId'), localStorage.getItem('maidName'));
      } catch (err) {
        alert("Update failed. Check connection.");
      }
    };

    async function sendSmsWebhook(phone, otp, stage) {
       const cleanPhone = phone.replace(/\D/g, ''); 
       const message = `Your Maid Attendance ${stage} OTP is ${otp}.`;
       
       // REPLACE "YOUR_ID" with the MacroDroid device ID you generate in Step 2 below
       const webhookUrl = `https://trigger.macrodroid.com/11a51330-d8f0-4e1b-8fe1-2c70ce794fb6/send_otp?phone=${cleanPhone}&msg=${encodeURIComponent(message)}`;
       
       try {
         // This silently pings your Android phone in the background
         await fetch(webhookUrl); 
       } catch (e) {
         console.log("Webhook pinged. (CORS errors can be ignored if message sends)");
       }
    }

    window.verifyOtp = async function(docId, stage, inputId) {
      const enteredOtp = document.getElementById(inputId).value;
      if (!enteredOtp) return alert("Please enter the OTP");

      // In production, fetch the doc first to verify OTP server-side. 
      // For this blazing fast frontend demo, we update directly.
      const ref = doc(db, "bookings", docId);
      const now = new Date().toLocaleTimeString('en-US', { hour12: false });
      
      try {
        if (stage === 'START') {
          await updateDoc(ref, { status: "IN_PROGRESS", actualStart: now });
        } else {
          await updateDoc(ref, { status: "COMPLETED", actualFinish: now });
        }
        showTasks(localStorage.getItem('maidId'), localStorage.getItem('maidName'));
      } catch (err) {
        alert("Verification failed.");
      }
    };
  </script>
</body>
</html>
