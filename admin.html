<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Maid Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Top Header -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-slate-200 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Admin Operations</h1>
        <p class="text-sm text-slate-500 mt-1">Manage bookings, monitor live attendance, and register personnel</p>
      </div>
      
      <!-- Tab Navigation -->
      <nav class="flex space-x-2 bg-slate-200/70 p-1.5 rounded-xl">
        <button id="tabTrackerBtn" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-white text-blue-600 shadow-sm">
          Live Tracker
        </button>
        <button id="tabManageBtn" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900">
          Bookings & Staff
        </button>
      </nav>
    </header>

    <!-- ==================== VIEW 1: LIVE ATTENDANCE TRACKER ==================== -->
    <section id="trackerSection" class="mt-6 space-y-6">
      
      <!-- Filter Bar -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Date</label>
          <input type="date" id="filterDate" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Customer</label>
          <select id="filterCust" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">All Customers</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Maid</label>
          <select id="filterMaid" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">All Maids</option>
          </select>
        </div>
        <div class="flex gap-2">
          <button id="refreshBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
            <span>🔄 Refresh</span>
          </button>
        </div>
      </div>

      <!-- Visits Table -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-500 font-semibold text-xs uppercase tracking-wider border-b border-slate-200">
              <tr>
                <th class="px-5 py-3.5">Booking ID</th>
                <th class="px-5 py-3.5">Customer & Address</th>
                <th class="px-5 py-3.5">Maid</th>
                <th class="px-5 py-3.5">Status</th>
                <th class="px-5 py-3.5">Sched. Time</th>
                <th class="px-5 py-3.5">Actual Start</th>
                <th class="px-5 py-3.5">Actual Finish</th>
                <th class="px-5 py-3.5">Duration</th>
              </tr>
            </thead>
            <tbody id="visitsTableBody" class="divide-y divide-slate-100">
              <tr>
                <td colspan="8" class="text-center py-12 text-slate-400">Loading attendance data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ==================== VIEW 2: BOOKINGS & REGISTER PERSONNEL ==================== -->
    <section id="manageSection" class="mt-6 hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Create Booking Form (Spans 2 Columns) -->
      <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-xl">📅</span>
          <h2 class="text-lg font-bold text-slate-900">Schedule Service Visit</h2>
        </div>
        
        <form id="createBookingForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Select Customer</label>
              <select id="bookCustomer" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">-- Choose Customer --</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Assign Maid</label>
              <select id="bookMaid" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">-- Choose Maid --</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Service Address</label>
            <input type="text" id="bookAddress" required placeholder="Service location (autofilled from customer)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Scheduled Date</label>
              <input type="date" id="bookDate" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Scheduled Time</label>
              <input type="time" id="bookTime" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>

          <button type="submit" id="submitBookingBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition active:scale-95 text-sm mt-2">
            Create Booking
          </button>
        </form>
      </div>

      <!-- Register Customer and Maid -->
      <div class="space-y-6">
        
        <!-- Add Customer -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-xl">👤</span>
            <h2 class="text-base font-bold text-slate-900">Add Customer</h2>
          </div>
          <form id="addCustForm" class="space-y-3">
            <input type="text" id="custName" required placeholder="Full Name (e.g. Mrs. Sharma)" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="tel" id="custPhone" required placeholder="10-digit Phone Number" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="text" id="custAddress" required placeholder="Default Address" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="submit" id="addCustBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 rounded-xl text-sm transition">
              Save Customer
            </button>
          </form>
        </div>

        <!-- Add Maid -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-xl">🧹</span>
            <h2 class="text-base font-bold text-slate-900">Add Maid</h2>
          </div>
          <form id="addMaidForm" class="space-y-3">
            <input type="text" id="maidName" required placeholder="Full Name (e.g. Rekha Bai)" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="tel" id="maidPhone" required placeholder="10-digit Phone Number" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="maidPin" required placeholder="4-Digit PIN (e.g. 1234)" maxlength="6" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="submit" id="addMaidBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 rounded-xl text-sm transition">
              Save Maid
            </button>
          </form>
        </div>

      </div>
    </section>

  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, doc, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
    apiKey: "AIzaSyA24bw7FrAKTH0_Uhh7ECTbRZoQ7FdhZCQ",
    authDomain: "maidattendance-2a612.firebaseapp.com",
    projectId: "maidattendance-2a612",
    storageBucket: "maidattendance-2a612.firebasestorage.app",
    messagingSenderId: "275781550714",
    appId: "1:275781550714:web:4268d16d51f6d8405ab1c3",
    measurementId: "G-GRLXDQ1TWD"
  };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    // Cache State
    let customersList = [];
    let maidsList = [];
    let currentVisits = [];

    // Elements
    const trackerSection = document.getElementById('trackerSection');
    const manageSection = document.getElementById('manageSection');
    const tabTrackerBtn = document.getElementById('tabTrackerBtn');
    const tabManageBtn = document.getElementById('tabManageBtn');
    const filterDate = document.getElementById('filterDate');
    const filterCust = document.getElementById('filterCust');
    const filterMaid = document.getElementById('filterMaid');
    const visitsTableBody = document.getElementById('visitsTableBody');

    // Default to today's date
    const today = new Date();
    const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    filterDate.value = todayStr;
    document.getElementById('bookDate').value = todayStr;

    // Tab Switching
    tabTrackerBtn.addEventListener('click', () => {
      trackerSection.classList.remove('hidden');
      manageSection.classList.add('hidden');
      tabTrackerBtn.classList.replace('text-slate-600', 'text-blue-600');
      tabTrackerBtn.classList.add('bg-white', 'shadow-sm');
      tabManageBtn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
      tabManageBtn.classList.add('text-slate-600');
      loadVisits();
    });

    tabManageBtn.addEventListener('click', () => {
      manageSection.classList.remove('hidden');
      trackerSection.classList.add('hidden');
      tabManageBtn.classList.replace('text-slate-600', 'text-blue-600');
      tabManageBtn.classList.add('bg-white', 'shadow-sm');
      tabTrackerBtn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
      tabTrackerBtn.classList.add('text-slate-600');
    });

    // Load Dropdown Options (Customers and Maids)
    async function loadDropdowns() {
      try {
        // Fetch Customers
        const custSnap = await getDocs(collection(db, "customers"));
        customersList = [];
        let custSelectHtml = '<option value="">All Customers</option>';
        let bookCustHtml = '<option value="">-- Choose Customer --</option>';
        custSnap.forEach(d => {
          const c = { id: d.id, ...d.data() };
          customersList.push(c);
          custSelectHtml += `<option value="${c.name}">${c.name}</option>`;
          bookCustHtml += `<option value="${c.id}">${c.name}</option>`;
        });
        filterCust.innerHTML = custSelectHtml;
        document.getElementById('bookCustomer').innerHTML = bookCustHtml;

        // Fetch Maids
        const maidSnap = await getDocs(collection(db, "maids"));
        maidsList = [];
        let maidSelectHtml = '<option value="">All Maids</option>';
        let bookMaidHtml = '<option value="">-- Choose Maid --</option>';
        maidSnap.forEach(d => {
          const m = { id: d.id, ...d.data() };
          maidsList.push(m);
          maidSelectHtml += `<option value="${m.name}">${m.name}</option>`;
          bookMaidHtml += `<option value="${m.maidId}">${m.name}</option>`;
        });
        filterMaid.innerHTML = maidSelectHtml;
        document.getElementById('bookMaid').innerHTML = bookMaidHtml;
      } catch (err) {
        console.error("Dropdown loading failed:", err);
      }
    }

    // Auto-fill address on Customer Select
    document.getElementById('bookCustomer').addEventListener('change', (e) => {
      const selected = customersList.find(c => c.id === e.target.value);
      if (selected) {
        document.getElementById('bookAddress').value = selected.address || '';
      }
    });

    // Calculate duration in minutes between "HH:mm:ss" strings
    function calculateDuration(startStr, finishStr) {
      if (!startStr || !finishStr) return '--';
      const [h1, m1] = startStr.split(':').map(Number);
      const [h2, m2] = finishStr.split(':').map(Number);
      let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
      if (mins < 0) mins += 1440; // overnight boundary safe
      return `${mins} min`;
    }

    // Load Visits for Date
    async function loadVisits() {
      visitsTableBody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-slate-400 animate-pulse">Fetching visits from Firestore...</td></tr>`;
      
      const dateVal = filterDate.value;
      try {
        const q = query(collection(db, "bookings"), where("date", "==", dateVal));
        const snapshot = await getDocs(q);
        
        currentVisits = [];
        snapshot.forEach(d => {
          currentVisits.push({ id: d.id, ...d.data() });
        });
        renderTable();
      } catch (err) {
        visitsTableBody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-500">Failed to load visits. Verify connection and security rules.</td></tr>`;
      }
    }

    // Filter and Render Table
    function renderTable() {
      const selectedCust = filterCust.value;
      const selectedMaid = filterMaid.value;

      const filtered = currentVisits.filter(v => {
        return (selectedCust === "" || v.customerName === selectedCust) &&
               (selectedMaid === "" || v.maidName === selectedMaid);
      });

      if (filtered.length === 0) {
        visitsTableBody.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-slate-400 font-medium">No bookings found for the selected criteria.</td></tr>`;
        return;
      }

      let html = '';
      filtered.forEach(v => {
        let statusBadge = '';
        if (v.status === 'SCHEDULED') statusBadge = '<span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full text-xs font-semibold">SCHEDULED</span>';
        else if (v.status === 'IN_PROGRESS') statusBadge = '<span class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full text-xs font-semibold">IN PROGRESS</span>';
        else if (v.status === 'COMPLETED') statusBadge = '<span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold">COMPLETED</span>';
        else statusBadge = '<span class="bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full text-xs font-semibold">OTP PENDING</span>';

        const duration = calculateDuration(v.actualStart, v.actualFinish);

        html += `
          <tr class="hover:bg-slate-50/60 transition">
            <td class="px-5 py-4 font-mono font-medium text-xs text-slate-600">${v.bookingId || v.id.slice(0,8)}</td>
            <td class="px-5 py-4">
              <div class="font-semibold text-slate-900">${v.customerName}</div>
              <div class="text-xs text-slate-500 truncate max-w-xs">${v.address}</div>
            </td>
            <td class="px-5 py-4 font-medium text-slate-800">${v.maidName || v.maidId}</td>
            <td class="px-5 py-4">${statusBadge}</td>
            <td class="px-5 py-4 font-mono text-xs text-slate-700">${v.time || '--'}</td>
            <td class="px-5 py-4 font-mono text-xs text-blue-600 font-semibold">${v.actualStart || '--'}</td>
            <td class="px-5 py-4 font-mono text-xs text-emerald-600 font-semibold">${v.actualFinish || '--'}</td>
            <td class="px-5 py-4 font-semibold text-slate-800">${duration}</td>
          </tr>
        `;
      });
      visitsTableBody.innerHTML = html;
    }

    // Filter listeners
    filterDate.addEventListener('change', loadVisits);
    filterCust.addEventListener('change', renderTable);
    filterMaid.addEventListener('change', renderTable);
    document.getElementById('refreshBtn').addEventListener('click', loadVisits);

    // Form Submissions: Create Booking
    document.getElementById('createBookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBookingBtn');
      btn.innerText = "Saving Booking..."; btn.disabled = true;

      const custId = document.getElementById('bookCustomer').value;
      const maidId = document.getElementById('bookMaid').value;
      const custObj = customersList.find(c => c.id === custId);
      const maidObj = maidsList.find(m => m.maidId === maidId);

      const bookingData = {
        bookingId: 'BK-' + document.getElementById('bookDate').value.replace(/-/g, '') + '-' + Math.floor(1000 + Math.random() * 9000),
        customerId: custId,
        customerName: custObj.name,
        customerPhone: custObj.phone || '',
        address: document.getElementById('bookAddress').value,
        maidId: maidId,
        maidName: maidObj.name,
        date: document.getElementById('bookDate').value,
        time: document.getElementById('bookTime').value,
        status: 'SCHEDULED',
        createdAt: new Date().toISOString()
      };

      try {
        await addDoc(collection(db, "bookings"), bookingData);
        alert("Booking created successfully!");
        document.getElementById('createBookingForm').reset();
        document.getElementById('bookDate').value = todayStr;
        tabTrackerBtn.click();
      } catch (err) {
        alert("Failed to create booking: " + err.message);
      }
      btn.innerText = "Create Booking"; btn.disabled = false;
    });

    // Form Submissions: Add Customer
    document.getElementById('addCustForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('addCustBtn');
      btn.innerText = "Saving..."; btn.disabled = true;

      try {
        await addDoc(collection(db, "customers"), {
          name: document.getElementById('custName').value.trim(),
          phone: document.getElementById('custPhone').value.trim(),
          address: document.getElementById('custAddress').value.trim(),
          status: 'ACTIVE'
        });
        alert("Customer added!");
        document.getElementById('addCustForm').reset();
        loadDropdowns();
      } catch (err) {
        alert("Error saving customer: " + err.message);
      }
      btn.innerText = "Save Customer"; btn.disabled = false;
    });

    // Form Submissions: Add Maid
    document.getElementById('addMaidForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('addMaidBtn');
      btn.innerText = "Saving..."; btn.disabled = true;

      try {
        await addDoc(collection(db, "maids"), {
          maidId: 'MAID-' + Math.floor(100 + Math.random() * 900),
          name: document.getElementById('maidName').value.trim(),
          phone: document.getElementById('maidPhone').value.trim(),
          pin: document.getElementById('maidPin').value.trim(),
          status: 'ACTIVE'
        });
        alert("Maid added!");
        document.getElementById('addMaidForm').reset();
        loadDropdowns();
      } catch (err) {
        alert("Error saving maid: " + err.message);
      }
      btn.innerText = "Save Maid"; btn.disabled = false;
    });

    // Initialize on page load
    loadDropdowns();
    loadVisits();
  </script>
</body>
</html>
